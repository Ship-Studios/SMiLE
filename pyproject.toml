[project]
name = "smile-mcp"
version = "0.3.0"
description = "SMiLE (Secure Message in Lambda Expressions) -- prototype MCP server for agent-authored Python against a sandboxed capability namespace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0.3"]
dev = ["google-genai>=2.17.0", "pyyaml>=6.0.3"]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
]

[project.scripts]
smile-mcp = "smile.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smile"]
