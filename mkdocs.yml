site_name: SMiLE
site_description: >-
  SMiLE (Secure Message in Lambda Expressions) -- an MCP server that lets an
  LLM agent write a Python script against a curated set of your app's
  functions, run it sandboxed, and get back only the final result.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Defining capabilities: capabilities.md
  - API Reference:
      - CapabilityRegistry: reference/capability_registry.md
      - Capability: reference/capability.md
      - CapabilitySpec: reference/capability_spec.md
      - capability marker: reference/capability_marker.md
      - RegistrationReport: reference/registration_report.md
      - Errors: reference/errors.md
      - run_script: reference/run_script.md
      - ScriptResult: reference/script_result.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            members_order: source
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
